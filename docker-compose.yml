services:
  presensi-bot:
    build: .
    container_name: maganghub-presensi
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      - HEADLESS=false
    volumes:
      - ./data_presensi_maganghub.json:/app/data_presensi_maganghub.json:ro
      - ./chrome_profile:/app/chrome_profile
      - ./logs:/app/logs
